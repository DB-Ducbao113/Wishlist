name = "dream-vault-image-upload"
main = "src/index.js"
compatibility_date = "2026-10-16"
workers_dev = true

[vars]
CLOUDINARY_CLOUD_NAME = "herun6yp"
FIREBASE_PROJECT_ID = "wishlist-787d2"

# Exact-origin allowlist, comma separated. The check is always enforced.
# Production origin first; add the Firebase Hosting preview origin when testing
# (e.g. "https://wishlist-787d2.web.app,https://wishlist-787d2--image-sync-v1-XXXX.web.app").
# Never set "*" and never disable the check.
ALLOWED_ORIGINS = "https://wishlist-787d2.web.app"

# IMPORTANT: `wrangler deploy` (used by Cloudflare Builds) REMOVES plaintext vars
# that are not declared in this file. Store these as encrypted Worker SECRETS so
# they survive every deploy (otherwise the Worker answers 503 "not configured"):
#   CLOUDINARY_API_KEY    (encrypted secret)
#   CLOUDINARY_API_SECRET (encrypted secret)
# Do NOT commit either value.
#
# Cloudflare Builds settings:
# Root directory: workers/cloudinary-sign
# Deploy command: npx wrangler deploy
# Build command: leave empty
